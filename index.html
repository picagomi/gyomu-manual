<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NagomiResort">
<link rel="manifest" href="manifest.json">
<title>NagomiResort マニュアル｜写真でつくる業務マニュアル</title>
<style>
:root{
  --brand:#16a34a;
  --brand-dark:#15803d;
  --brand-deep:#14532d;
  --brand-tint:#dcfce7;
  --brand-tint2:#f0fdf4;
  --bg:#f4f7f5;
  --card:#ffffff;
  --line:#e2e8e5;
  --text:#132018;
  --muted:#6b7f74;
  --warn:#b45309;
  --warn-bg:#fffbeb;
  --warn-line:#fcd34d;
  --danger:#dc2626;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,40,28,.06),0 8px 24px rgba(16,40,28,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:16px;line-height:1.65;
  overscroll-behavior-y:none;
}
img{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* ---------- App bar ---------- */
.bar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,var(--brand-dark),var(--brand));
  color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  box-shadow:0 2px 12px rgba(20,83,45,.25);
}
.bar-row{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:10px;min-height:38px}
/* 非表示のボタンがあっても列がずれないよう、位置を固定する */
.bar-row #backBtn{grid-column:1;grid-row:1}
.bar h1{grid-column:2;grid-row:1;font-size:19px;margin:0;font-weight:800;letter-spacing:.02em;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-right{grid-column:3;grid-row:1;display:flex;justify-content:flex-end}
.bar .sub{font-size:12px;opacity:.85;margin-top:3px;text-align:center}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:#fff;background:rgba(255,255,255,.16);font-size:18px;flex:none;
}
.iconbtn:active{background:rgba(255,255,255,.3)}
.searchwrap{margin-top:10px;position:relative}
.searchwrap input{
  width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:none;
  background:rgba(255,255,255,.95);font-size:15px;
}
.searchwrap span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;font-size:15px}

/* ---------- Layout ---------- */
.page{padding:16px 16px calc(110px + var(--safe-b))}
.hidden{display:none!important}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;margin:22px 2px 10px}

/* ---------- Cards (list) ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;
}
.mcard{display:flex;gap:0;align-items:stretch;width:100%;text-align:left}
.mcard .thumb{width:104px;flex:none;background:var(--brand-tint2);position:relative}
.mcard .thumb img{width:100%;height:100%;object-fit:cover}
.mcard .thumb .ph{width:100%;height:100%;display:grid;place-items:center;font-size:26px;opacity:.4}
.mcard .body{padding:12px 14px;flex:1;min-width:0}
.mcard h3{margin:0 0 4px;font-size:16px;font-weight:800;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mcard .meta .pill{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  display:inline-block;background:var(--brand-tint);color:var(--brand-deep);
  padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;
}
.pill.gray{background:#eef2f0;color:var(--muted)}
.pill.new{background:#fee2e2;color:#b91c1c}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .em{font-size:52px;margin-bottom:8px}
.empty h2{font-size:17px;color:var(--text);margin:0 0 6px}
.steps-guide{
  text-align:left;background:var(--card);border:1px dashed var(--brand);border-radius:var(--radius);
  padding:14px 16px;margin-top:18px;
}
.steps-guide li{margin:6px 0;font-size:14px}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 16px;border-radius:14px;font-weight:800;font-size:16px;
  background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.28);
}
.btn:active{transform:translateY(1px)}
.btn.sub{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand);box-shadow:none}
.btn.ghost{background:#eef3f0;color:var(--text);box-shadow:none}
.btn.danger{background:#fff;color:var(--danger);border:1.5px solid #fecaca;box-shadow:none}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
.btn.slim{padding:3px 14px;font-size:13.5px;line-height:1.7;border-radius:10px;box-shadow:none}
.btnrow{display:flex;gap:10px}
.fabwrap{
  position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none;
  padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(180deg,rgba(244,247,245,0),rgba(244,247,245,.95) 42%);
}
.fabwrap>*{pointer-events:auto;max-width:528px;margin:0 auto}

/* ---------- Form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--brand-deep)}
.field input[type=text],.field textarea,.field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff;font-size:16px;
}
.field textarea{min-height:84px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:6px 11px;border-radius:999px;background:var(--brand-tint2);border:1px solid var(--brand-tint);
  color:var(--brand-deep);font-size:12.5px;font-weight:700}
.chip:active{background:var(--brand-tint)}

/* ---------- Step editor ---------- */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.step-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand-tint2);
  border-bottom:1px solid var(--line)}
.stepno{width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.step-head .sp{flex:1}
.minibtn{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;color:var(--muted)}
.minibtn:active,.minibtn:active{background:#eef3f0}
.minibtn.del{color:var(--danger);border-color:#fecaca}
.shots{display:grid;gap:3px;background:#0d1a13}
.shots[data-n="0"]{background:var(--brand-tint2)}
.shots[data-n="1"]{grid-template-columns:1fr}
.shots[data-n="2"]{grid-template-columns:1fr 1fr}
.shot{position:relative;background:#0d1a13;display:flex;align-items:center;justify-content:center}
.shots[data-n="1"] .shot img{width:100%;max-height:340px;object-fit:contain}
.shots[data-n="2"] .shot{aspect-ratio:3/4}
.shots[data-n="2"] .shot img{width:100%;height:100%;object-fit:contain}
.shot-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:9px;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.shot-n{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;
  font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.shots-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;background:var(--brand-tint2);border-bottom:1px solid var(--line)}
.vshots{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#0d1a13}
.vshots .shot{aspect-ratio:3/4}
.vshots img{width:100%;height:100%;object-fit:contain}
.zoomer{position:fixed;inset:0;z-index:80;background:rgba(6,16,11,.94);display:flex;
  align-items:center;justify-content:center;padding:14px}
.zoomer img{max-width:100%;max-height:100%;object-fit:contain}
.zoomer .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;
  width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;
  font-size:18px;display:grid;place-items:center}
.step-photo{position:relative;background:#0d1a13}
.step-photo.noimg{background:var(--brand-tint2);border-bottom:1px dashed var(--brand)}
.step-photo .nophoto{padding:30px 14px;text-align:center;color:#7d9a8c;font-size:13px;font-weight:700}
.step-photo.noimg .replace{background:var(--brand)}
.tplbtn{flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.tplbtn .t{font-size:15.5px;font-weight:800}
.tplbtn .d{font-size:12px;font-weight:600;color:var(--muted);line-height:1.5}
.step-photo img{width:100%;max-height:340px;object-fit:contain;background:#0d1a13}
.step-photo .replace{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;
  padding:7px 11px;border-radius:10px;font-size:12px;font-weight:700}
.step-body{padding:12px 14px}
.step-body .field:last-child{margin-bottom:0}

/* ---------- 場所（複数拠点）と対応チェック ---------- */
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .x{margin-left:7px;font-weight:900;color:#fff;opacity:.85}
.psel{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px}
.psel::-webkit-scrollbar{display:none}
.pchip{flex:none;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
  font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap}
.pchip.done{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-tint2)}
.pchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pchip.done.on{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:82px;
  padding:14px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
  box-shadow:var(--shadow);text-align:center}
.ptile .nm{font-size:17px;font-weight:800;color:var(--text);line-height:1.3}
.ptile .st{font-size:12px;font-weight:700;color:var(--muted)}
.ptile.done{background:var(--brand-tint2);border-color:var(--brand)}
.ptile.done .nm{color:var(--brand-deep)}
.ptile.done .st{color:var(--brand-dark)}
.ptile:active{transform:translateY(1px)}
.crumb{display:flex;width:fit-content;align-items:center;gap:7px;background:var(--brand-tint);color:var(--brand-deep);
  border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;margin:0 auto 14px}
.sec-title.mid{text-align:center;margin-left:0;margin-right:0}
.stepplaces{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-tint);color:var(--brand-deep)}
.tag.all{background:#eef2f0;color:var(--muted)}
.prog{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:10px;
  box-shadow:var(--shadow)}
.prog-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:8px}
.prog-top span{color:var(--brand-dark)}
.pbar{height:9px;border-radius:999px;background:#e8efea;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#4ade80);
  transition:width .35s ease}
.prog .rest{font-size:11.5px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-panel{background:linear-gradient(160deg,var(--brand),var(--brand-dark));color:#fff;border-radius:14px;
  padding:14px 16px;margin-bottom:10px;text-align:center;box-shadow:0 6px 20px rgba(21,128,61,.35);
  animation:pop .3s ease-out}
.done-panel b{display:block;font-size:19px;font-weight:900;letter-spacing:.02em}
.done-panel span{font-size:12.5px;opacity:.92}
.done-panel button{margin-top:11px;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;
  padding:8px 15px;font-size:12.5px;font-weight:800}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.logbox li{list-style:none;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.logbox li:last-child{border-bottom:none}
.logbox ul{margin:0;padding:0}

/* ---------- 手順の一覧（タップして操作を選ぶ） ---------- */
.srow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:11px 12px;margin-bottom:10px}
.srow:active{background:var(--brand-tint2)}
.srow .stepno{flex:none}
.srow-thumb{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;
  background:var(--brand-tint2);display:grid;place-items:center;font-size:20px}
.srow-thumb img{width:100%;height:100%;object-fit:cover}
.srow-body{flex:1;min-width:0;display:block}
.srow-t{display:block;font-size:15px;font-weight:800;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-meta{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-arrow{flex:none;color:var(--brand);font-size:22px;font-weight:800;line-height:1}
.btn:disabled{opacity:.4}

/* ---------- ゴミ箱 ---------- */
.trash-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.trash-row:last-of-type{border-bottom:none}
.trash-thumb{width:58px;height:58px;flex:none;border-radius:11px;overflow:hidden;
  background:var(--brand-tint2);display:grid;place-items:center;font-size:22px;opacity:.9}
.trash-thumb img{width:100%;height:100%;object-fit:cover}
.trash-body{flex:1;min-width:0}
.trash-t{font-size:14.5px;font-weight:800;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trash-acts{display:flex;gap:8px;margin-top:8px}
.btn.sm.danger{background:#fff;color:var(--danger);border:1.5px solid #fecaca;box-shadow:none}

/* ---------- 枝（マインドマップ表示） ---------- */
.stepwrap{margin-bottom:16px}
.stepwrap .v-step{margin-bottom:0}
.branches{margin:0 0 0 30px;padding-left:22px;border-left:2px solid var(--brand-tint)}
.branch{position:relative;margin-top:12px}
.branch::before{content:'';position:absolute;left:-22px;top:24px;width:22px;height:2px;background:var(--brand-tint)}
.branch::after{content:'';position:absolute;left:-27px;top:19px;width:10px;height:10px;border-radius:50%;
  background:var(--brand);border:2px solid var(--bg)}
.branch-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden}
.branch-card h4{margin:0;padding:12px 14px 0;font-size:15.5px;font-weight:800;line-height:1.45}
.branch-card .btxt{padding:9px 14px 13px;font-size:14.5px;white-space:pre-wrap}
.branch-card .caution{margin:0 14px 13px}

/* 編集画面の枝 */
.br-edit{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.br-label{font-size:12px;font-weight:800;color:var(--brand-deep);margin-bottom:9px;letter-spacing:.04em}
.br-row{border-left:3px solid var(--brand-tint);padding-left:11px;margin-bottom:12px}
.br-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.br-no{font-size:11px;font-weight:800;color:#fff;background:var(--brand);border-radius:7px;padding:3px 7px;flex:none}
.br-head input{flex:1;min-width:0;padding:9px 11px!important;font-size:14px!important}
.br-row textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;
  font-size:14px;min-height:60px;line-height:1.6;resize:vertical}
.br-row textarea:focus,.br-head input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.br-row .shots{margin-top:8px;border-radius:10px;overflow:hidden}
.br-actions{display:flex;gap:8px;margin-top:8px}

/* ---------- Viewer ---------- */
.v-hero{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
  background:#0d1a13;margin-bottom:14px}
.v-hero img{width:100%;max-height:300px;object-fit:cover}
.v-title{font-size:22px;font-weight:900;line-height:1.45;margin:0 0 8px;text-align:center}
.v-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:16px}
.v-step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.v-step-head{display:flex;gap:10px;align-items:flex-start;padding:13px 14px}
.v-step-head h3{margin:0;font-size:17px;font-weight:800;line-height:1.45;flex:1}
.v-step img{width:100%;max-height:70vh;object-fit:contain;background:#0d1a13}
.v-step .txt{padding:12px 14px;white-space:pre-wrap;font-size:15.5px}
.caution{
  margin:0 14px 14px;padding:11px 13px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:12px;color:#7c4a03;font-size:14.5px;white-space:pre-wrap;
}
.caution b{color:var(--warn);display:block;font-size:12px;letter-spacing:.06em;margin-bottom:3px}
.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-top:16px;overflow:hidden;box-shadow:var(--shadow)}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:13px 15px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.fold summary::-webkit-details-marker{display:none}
.fold summary .fb{background:#eef2f0;color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px}
.fold summary .fc{margin-left:auto;color:var(--brand);font-size:13px;transition:transform .2s}
.fold[open] summary{border-bottom:1px solid var(--line);color:var(--brand-deep)}
.fold[open] summary .fc{transform:rotate(180deg)}
.fold-body{padding:2px 15px 6px}
.hist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 14px}
.hist li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;list-style:none}
.hist li:last-child{border-bottom:none}
.hist ul{margin:0;padding:0}
.hist .d{color:var(--brand-dark);font-weight:800;font-size:12px}

/* ---------- Sheet / modal ---------- */
.gate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(170deg,var(--brand-dark),var(--brand-deep))}
.gate-box{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:26px 22px calc(22px + var(--safe-b));
  box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}
.gate-logo{font-size:44px;line-height:1}
.gate-box h2{margin:8px 0 6px;font-size:19px;font-weight:900}
.gate-box p{margin:0 0 18px;font-size:13.5px;color:var(--muted);line-height:1.7}
.gate-box input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:17px;text-align:center;letter-spacing:.08em}
.gate-box input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.gate-msg{min-height:20px;margin:9px 0 12px;font-size:13px;font-weight:800;color:var(--danger)}
.gate-msg.wait{color:var(--muted)}

<script src="firebase-config.js"></script>
<script type="module" src="cloud.js"></script>

<script>
/* =========================================================
   現場マニュアル  —  写真から業務マニュアルを作るスマホアプリ
   データは端末内(IndexedDB)に保存。オフラインでも動きます。
   ========================================================= */

/* ---------- IndexedDB ---------- */
const DB_NAME = 'genba-manual', DB_VER = 1;
let _db;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('manuals')) d.createObjectStore('manuals',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images'))  d.createObjectStore('images',{keyPath:'id'});
    };
    r.onsuccess = ()=>{ _db = r.result; res(_db); };
    r.onerror   = ()=> rej(r.error);
  });
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(store, mode);
    const s = t.objectStore(store);
    const req = fn(s);
    t.oncomplete = ()=> res(req && req.result);
    t.onerror = ()=> rej(t.error);
  });
}
const idbGet    = (st,id)=> tx(st,'readonly', s=> s.get(id));
const idbAll    = (st)   => tx(st,'readonly', s=> s.getAll());
const idbPut    = (st,v) => tx(st,'readwrite',s=> s.put(v));
const idbDel    = (st,id)=> tx(st,'readwrite',s=> s.delete(id));

/* ---------- Utils ---------- */
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const $  = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return `${fmtDate(ts)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function ago(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m < 1) return 'たった今';
  if(m < 60) return `${m}分前`;
  const h = Math.floor(m/60); if(h < 24) return `${h}時間前`;
  const d = Math.floor(h/24); if(d < 7) return `${d}日前`;
  return fmtDate(ts);
}
let toastT;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('has-act');
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('on'), 2200);
}
/* 「元に戻す」つきのお知らせ */
function toastAction(msg, label, cb){
  const t = $('toast');
  t.innerHTML = `<span></span><button class="t-act"></button>`;
  t.querySelector('span').textContent = msg;
  const b = t.querySelector('.t-act');
  b.textContent = label;
  b.onclick = ()=>{ clearTimeout(toastT); t.classList.remove('on','has-act'); cb(); };
  t.classList.add('on','has-act');
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('on','has-act'), 6000);
}

/* 画像を長辺1600pxのJPEGに縮小（スマホ写真をそのまま入れても軽い） */
function shrink(file){
  return new Promise(resolve=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX = 1600;
      let {width:w, height:h} = img;
      const sc = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=> resolve(b || file), 'image/jpeg', 0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
/* 共有モードで動いているか（ログイン済みのときだけ true） */
const isCloud = ()=> !!(window.Cloud && Cloud.enabled && Cloud.user());

/* 共有先のエラーを、原因が分かる言葉にする */
function cloudErrorText(e){
  const c = (e && (e.code || e.message)) || '';
  if(c.includes('permission-denied'))
    return '権限がありません。Firestoreのセキュリティルールを確認してください';
  if(c.includes('unauthenticated'))
    return 'ログインが切れました。合い言葉を入れ直してください';
  if(c.includes('unavailable') || c.includes('network'))
    return '通信できません。電波が戻ったら自動で送信します';
  if(c.includes('failed-precondition'))
    return 'データベースの設定を確認してください（' + c + '）';
  if(c.includes('not-found'))
    return 'データベースが見つかりません（Firestoreが作成済みか確認してください）';
  return '共有できませんでした（' + (c || '原因不明') + '）';
}
/* 共有先への書き込み。
   すぐ失敗したらエラーを投げ、返事が遅いときは「送信待ち」として先に進む
   （圏外でも作業を止めないため。あとで失敗したらお知らせします） */
async function cloudWrite(promise){
  const LATE = Symbol('late');
  const r = await Promise.race([
    promise.then(()=> 'done'),
    new Promise(res=> setTimeout(()=> res(LATE), 2500))
  ]);
  if(r === LATE){
    promise.catch(e=> toast(cloudErrorText(e)));
    return 'queued';
  }
  return 'done';
}

const urlCache = new Map();
async function imgUrl(imageId){
  if(!imageId) return null;
  if(urlCache.has(imageId)) return urlCache.get(imageId);
  let rec = await idbGet('images', imageId);
  if(!rec && isCloud()){
    // 端末にまだ無い写真は共有先から取り寄せて、次回のために保存しておく
    try{
      const d = await Cloud.getPhoto(imageId);
      if(d){ const blob = await dataURLToBlob(d); await idbPut('images', {id: imageId, blob}); rec = {blob}; }
    }catch(e){ return null; }
  }
  if(!rec) return null;
  const u = URL.createObjectURL(rec.blob);
  urlCache.set(imageId, u);
  return u;
}
async function saveImage(file){
  const blob = await shrink(file);
  const id = 'img_' + uid();
  await idbPut('images', {id, blob});
  if(isCloud()){
    try{ await cloudWrite(Cloud.putPhoto(id, await blobToDataURL(blob))); }
    catch(e){ toast('写真：' + cloudErrorText(e)); }
  }
  return id;
}
/* 書き出し用：端末になければ共有先から取り寄せる */
async function photoDataURL(id){
  const rec = await idbGet('images', id);
  if(rec) return await blobToDataURL(rec.blob);
  if(isCloud()){ try{ return await Cloud.getPhoto(id); }catch(e){} }
  return null;
}
/* 画面上の <img data-img="id"> を一括で解決 */
async function hydrateImages(root=document){
  const nodes = [...root.querySelectorAll('img[data-img]')];
  await Promise.all(nodes.map(async n=>{
    const u = await imgUrl(n.dataset.img);
    if(u) n.src = u;
  }));
}

/* ---------- State ---------- */
let manuals = [];     // 一覧用（新しい順）
let current = null;   // 編集/閲覧中のマニュアル
let view = 'list';
let dirty = false;
let readSel = null;    // 閲覧中の場所（null = 場所えらび画面 / 'all' = 全手順 / id = その場所）

/* 旧データ（場所が1つのテキスト）を新形式（場所リスト）に変換 */
function migrate(m){
  if(!Array.isArray(m.places)){
    const old = (m.place || '').trim();
    m.places = old ? [{id:'pl_'+uid(), name: old}] : [];
  }
  delete m.place;
  if(!m.progress || typeof m.progress !== 'object') m.progress = {};
  if(!Array.isArray(m.rounds)) m.rounds = [];
  if(!Array.isArray(m.trash)) m.trash = [];
  m.trash = m.trash.filter(t=> t && t.step);
  m.trash.forEach(t=> normalizeStep(t.step));
  (m.steps || []).forEach(normalizeStep);
  return m;
}
function normalizeStep(s){
  if(!s) return s;
  if(!Array.isArray(s.placeIds)) s.placeIds = [];
  if(!Array.isArray(s.imageIds)) s.imageIds = s.imageId ? [s.imageId] : [];
  delete s.imageId;
  if(!Array.isArray(s.branches)) s.branches = [];
  s.branches.forEach(b=>{ if(!Array.isArray(b.imageIds)) b.imageIds = []; });
  return s;
}
const placesOf = m => m.places || [];
/* マニュアルが持つ写真IDを全部（枝の写真もふくむ） */
function stepImageIds(s){
  const ids = [...((s && s.imageIds) || [])];
  ((s && s.branches) || []).forEach(b=> (b.imageIds||[]).forEach(id=> ids.push(id)));
  return ids;
}
function allImageIds(m){
  const ids = [];
  (m.steps||[]).forEach(s=> ids.push(...stepImageIds(s)));
  (m.trash||[]).forEach(t=> ids.push(...stepImageIds(t.step)));
  return ids;
}
const doneCount = m => placesOf(m).filter(p=> (m.progress||{})[p.id]).length;

async function loadAll(){
  if(isCloud()) return;   // 共有モードでは watchManuals から届きます
  manuals = ((await idbAll('manuals')) || []).map(migrate);
  manuals.sort((a,b)=> b.updatedAt - a.updatedAt);
}

/* 共有先から一覧が届いたとき */
function onCloudManuals(list){
  manuals = list.map(migrate).sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  if(view === 'list'){ renderList(); return; }
  if(view === 'read' && current){
    const fresh = manuals.find(m=> m.id === current.id);
    if(!fresh){ toast('このマニュアルは削除されました'); goHome(); return; }
    const changed = JSON.stringify(fresh) !== JSON.stringify(current);
    current = fresh;
    if(changed) renderRead();
  }
  // 編集中は、書きかけを消さないように画面を触りません
}

/* ---------- Navigation ---------- */
function setView(v, opt={}){
  view = v;
  ['viewList','viewEdit','viewRead'].forEach(id=> $(id).classList.add('hidden'));
  $('searchWrap').classList.toggle('hidden', v !== 'list');
  $('backBtn').classList.toggle('hidden', v === 'list');
  $('homeBtn').classList.toggle('hidden', v === 'list');
  $('menuBtn').classList.toggle('hidden', v !== 'list');
  window.scrollTo(0,0);
  if(v === 'list'){
    $('barTitle').textContent = 'NagomiResort マニュアル';
    $('barSub').textContent = isCloud() ? '👥 みんなで共有中（更新はすぐ全員に反映）'
                                        : '写真をアップするだけ。スマホで手順書。';
    $('viewList').classList.remove('hidden');
    renderList();
  }else if(v === 'edit'){
    $('barTitle').textContent = opt.isNew ? '新しいマニュアル' : 'マニュアルを編集';
    $('barSub').textContent = '写真ごとに手順を書き足せます';
    editStep = null;
    $('viewEdit').classList.remove('hidden');
    renderEdit();
  }else{
    $('barTitle').textContent = current ? current.title : 'マニュアル';
    $('barSub').textContent = current ? '最終更新 ' + fmtDateTime(current.updatedAt) : '';
    $('viewRead').classList.remove('hidden');
    renderRead();
  }
}
function goHome(){
  current = null; readSel = null; editStep = null; setView('list');
}
/* 編集中は破棄の確認をはさむ */
function leaveEdit(go){
  if(view === 'edit' && dirty){
    confirmSheet('保存せずに移動しますか？','編集中の内容は破棄されます。','破棄して移動', ()=>{ dirty = false; go(); });
    return;
  }
  go();
}
$('backBtn').onclick = ()=>{
  // 手順を編集しているときは、まず手順の一覧へ
  if(view === 'edit' && editStep){ editStep = null; renderEdit(); window.scrollTo(0,0); return; }
  leaveEdit(()=>{
  if(view === 'edit' && current && current._from === 'read'){ delete current._from; setView('read'); return; }
  // 手順を見ているときは、まず「場所えらび」に戻る
  if(view === 'read' && current && readSel !== null && placesOf(current).length >= 2){
    readSel = null; renderRead(); return;
  }
  goHome();
  });
};
$('homeBtn').onclick = ()=> leaveEdit(goHome);

/* =========================================================
   一覧
   ========================================================= */
function renderList(){
  const q = ($('q').value || '').trim().toLowerCase();
  const list = manuals.filter(m=>{
    if(!q) return true;
    const hay = [m.title, ...placesOf(m).map(p=> p.name),
                 ...(m.steps||[]).map(s=> s.title+' '+s.body+' '+s.caution)].join(' ').toLowerCase();
    return hay.includes(q);
  });

  const el = $('viewList');
  if(!manuals.length){
    el.innerHTML = `
      <div class="empty">
        <div class="em">📗</div>
        <h2>まだマニュアルがありません</h2>
        <div class="tiny">現場の写真を撮って、そのままマニュアルにしましょう。</div>
        <ol class="steps-guide">
          <li><b>①「＋ マニュアルを追加」</b>を押す</li>
          <li><b>② タイトルを付ける</b>（例：給湯器リモコンの操作）</li>
          <li><b>③ 写真から手順を追加</b>（何枚でもOK・カメラ撮影も可）</li>
          <li><b>④ 手順をタップして中身を書く</b> → 保存</li>
        </ol>
        <div class="tiny" style="margin-top:12px;line-height:1.7">
          受付・コテージ・ヴィラなど<b>複数の場所</b>を登録すると、<br>
          場所ごとに手順を出し分けて「対応済」チェックができます。
        </div>
      </div>`;
  }else if(!list.length){
    el.innerHTML = `<div class="empty"><div class="em">🔍</div><h2>見つかりませんでした</h2>
      <div class="tiny">別のことばで検索してください。</div></div>`;
  }else{
    const recent = list.filter(m=> Date.now()-m.updatedAt < 3*86400000).length;
    el.innerHTML = `
      <div class="sec-title" style="margin-top:6px">マニュアル ${list.length}件${recent?`　/　最近更新 ${recent}件`:''}</div>
      ${list.map(m=>{
        const cover = (m.steps||[]).find(s=> (s.imageIds||[]).length);
        const isNew = Date.now()-m.updatedAt < 3*86400000;
        const pl = placesOf(m), dn = doneCount(m);
        return `
        <div class="card">
          <button class="mcard" data-open="${m.id}">
            <div class="thumb">${cover
              ? `<img data-img="${cover.imageIds[0]}" alt="">`
              : `<div class="ph">📷</div>`}</div>
            <div class="body">
              <h3>${esc(m.title)}</h3>
              <div class="meta">
                ${pl.slice(0,2).map(p=>`<span class="pill">${esc(p.name)}</span>`).join('')}
                ${pl.length>2 ? `<span class="pill gray">他${pl.length-2}か所</span>` : ''}
                <span class="pill gray">${(m.steps||[]).length}手順</span>
                ${isNew ? `<span class="pill new">更新</span>` : ''}
              </div>
              ${pl.length >= 2 && dn ? `<div class="meta" style="margin-top:5px">${
                dn === pl.length ? `<span class="pill">✓ 全${pl.length}か所 対応完了</span>`
                                 : `<span class="pill new">対応中 ${dn}/${pl.length}か所</span>`}</div>` : ''}
              <div class="meta" style="margin-top:5px">
                <span>改訂 v${(m.history||[]).length} ・ ${ago(m.updatedAt)}</span>
              </div>
            </div>
          </button>
        </div>`;
      }).join('')}`;
  }
  hydrateImages(el);
  el.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=> openManual(b.dataset.open));

  $('fab').innerHTML = `<button class="btn" id="newBtn">＋　マニュアルを追加</button>`;
  $('newBtn').onclick = newManual;
}
$('q').oninput = ()=> { if(view==='list') renderList(); };

async function openManual(id){
  const rec = isCloud() ? manuals.find(m=> m.id === id) : await idbGet('manuals', id);
  if(!rec) return;
  current = migrate(JSON.parse(JSON.stringify(rec)));
  readSel = null;
  setView('read');
}

/* =========================================================
   新規作成（写真を選ぶところから）
   ========================================================= */
let pickMode = null; // 'new' | 'append' | {replace: stepId}
function pickPhotos(mode){
  pickMode = mode;
  $('filePick').value = '';
  $('filePick').multiple = true;
  $('filePick').click();
}
/* 新しいマニュアルを作る（タイトルを決めてから、写真で手順を足していく） */
function newManual(){
  current = {
    id: 'man_' + uid(),
    title: '',
    places: [], progress: {}, rounds: [], trash: [],
    steps: [],
    createdAt: Date.now(), updatedAt: Date.now(),
    history: [], _isNew: true
  };
  editStep = null;
  setView('edit', {isNew:true});
}

$('filePick').onchange = async e=>{
  const files = [...e.target.files].filter(f=> f.type.startsWith('image/'));
  if(!files.length) return;
  toast('写真を読み込み中…');
  const ids = [];
  for(const f of files) ids.push(await saveImage(f));

  if(pickMode === 'append'){
    ids.forEach(imageId=> current.steps.push({id:'st_'+uid(), imageIds:[imageId], title:'', body:'', caution:'', placeIds:[], updatedAt:Date.now()}));
    dirty = true; renderEdit();
    toast(`${ids.length}枚を追加しました`);
  }else if(pickMode && pickMode.addTo){
    const st = current.steps.find(s=> s.id === pickMode.addTo);
    if(st && pickMode.br){
      const br = (st.branches||[]).find(b=> b.id === pickMode.br);
      if(br){
        br.imageIds = (br.imageIds || []).concat(ids);
        st.updatedAt = Date.now(); dirty = true; renderEdit();
        toast('枝に写真を追加しました');
      }
    }else if(st){
      st.imageIds = (st.imageIds || []).concat(ids);
      st.updatedAt = Date.now(); dirty = true; renderEdit();
      toast(st.imageIds.length >= 2 ? 'この手順に写真を追加しました（横に並びます）' : '写真を追加しました');
    }
  }
  pickMode = null;
};

function renderEdit(){

}

/* 一覧の1行 */
function stepRowHTML(m, s, i){

    <button class="srow" data-open-step="${s.id}">

/* 手順をタップしたときの操作メニュー */
function stepActionSheet(sid){
  const m = current;
  const i = m.steps.findIndex(s=> s.id === sid);
  if(i < 0) return;
  const s = m.steps[i];
  sheet(`
    <h2>${esc(s.title) || '手順 ' + (i+1)}</h2>
    <p class="lead">手順 ${i+1} / ${m.steps.length}　どうしますか？</p>
    <button class="btn" data-a="edit" style="margin-bottom:10px">✎ この手順を編集する</button>
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn sub" data-a="up" ${i===0?'disabled':''}>↑ 上へ</button>
      <button class="btn sub" data-a="down" ${i===m.steps.length-1?'disabled':''}>↓ 下へ</button>
    </div>
    <button class="btn danger" data-a="trash" style="margin-bottom:10px">🗑 ゴミ箱へ移動</button>
    <button class="btn ghost" data-a="cancel">キャンセル</button>`,
  (sh, close)=>{
    sh.querySelectorAll('[data-a]').forEach(b=> b.onclick = ()=>{
      const a = b.dataset.a;
      if(a === 'up' || a === 'down'){
        if(b.hasAttribute('disabled')) return;
        close(); moveStep(sid, a === 'up' ? -1 : 1); return;
      }
      close();
      if(a === 'edit'){ editStep = sid; renderEdit(); window.scrollTo(0,0); }
      else if(a === 'trash') moveStepToTrash(sid);
    });
  });
}

/* ===== ② 1つの手順を編集（終わったら次の工程へ） ===== */
function renderEditOne(){
  const m = current, el = $('viewEdit');
  const i = m.steps.findIndex(s=> s.id === editStep);
  const s = m.steps[i];
  const last = i === m.steps.length - 1;
  $('barSub').textContent = `手順 ${i+1} / ${m.steps.length} を編集`;

  el.innerHTML = `
    <button class="crumb" id="toStepList">← 手順の一覧へ</button>
    ${stepFormHTML(m, s, i)}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ghost" id="prevStep" ${i===0?'disabled':''}>← 前の手順</button>
      <button class="btn ghost" id="trashStep" style="flex:none;width:64px" aria-label="ゴミ箱へ">🗑</button>
    </div>`;
  hydrateImages(el);
  bindStepHandlers(el, m);

  $('toStepList').onclick = ()=>{ editStep = null; renderEdit(); window.scrollTo(0,0); };
  $('prevStep').onclick = ()=>{ if(i > 0){ editStep = m.steps[i-1].id; renderEdit(); window.scrollTo(0,0); } };
  $('trashStep').onclick = ()=>{ editStep = null; moveStepToTrash(s.id); };

  $('fab').innerHTML = `
    <div class="btnrow">
      <button class="btn" id="nextStep">${last ? '✓ 入力を終える（一覧へ）' : '次の手順へ進む →'}</button>
    </div>`;
  $('nextStep').onclick = ()=>{
    if(last){ editStep = null; }
    else editStep = m.steps[i+1].id;
    renderEdit(); window.scrollTo(0,0);
  };
}

/* マニュアル全体（タイトル・場所）の入力 */
function bindManualFields(el, m){
  $('fTitle').oninput = e=>{ m.title = e.target.value; dirty = true; };
  el.querySelectorAll('[data-t]').forEach(b=> b.onclick = ()=>{ m.title = b.dataset.t; $('fTitle').value = m.title; dirty = true; });

  const addPlace = name=>{
    name = (name || '').trim();
    if(!name) return;
    if(m.places.some(p=> p.name === name)){ toast('すでに追加されています'); return; }
    m.places.push({id:'pl_'+uid(), name});
    dirty = true; renderEdit();
    const inp = $('fPlaceNew'); if(inp){ inp.value = ''; inp.focus(); }
  };
  $('addPlace').onclick = ()=> addPlace($('fPlaceNew').value);
  $('fPlaceNew').onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); addPlace(e.target.value); } };
  el.querySelectorAll('[data-p]').forEach(b=> b.onclick = ()=> addPlace(b.dataset.p));
  el.querySelectorAll('[data-rmp]').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.rmp;
    m.places = m.places.filter(p=> p.id !== id);
    m.steps.forEach(s=> s.placeIds = (s.placeIds||[]).filter(x=> x !== id));
    if(m.progress) delete m.progress[id];
    dirty = true; renderEdit();
  });
}

/* 手順フォームの入力・写真・枝 */
function bindStepHandlers(el, m){
  el.querySelectorAll('[data-f]').forEach(inp=>{
    inp.oninput = e=>{
      const s = m.steps.find(x=> x.id === inp.dataset.id);
      if(!s) return;
      s[inp.dataset.f] = e.target.value; s.updatedAt = Date.now(); dirty = true;
    };
  });
  el.querySelectorAll('[data-sp]').forEach(b=> b.onclick = ()=>{
    const s = m.steps.find(x=> x.id === b.dataset.sp);
    if(!s) return;
    const pid = b.dataset.pid;
    s.placeIds = s.placeIds || [];
    if(!pid) s.placeIds = [];
    else if(s.placeIds.includes(pid)) s.placeIds = s.placeIds.filter(x=> x !== pid);
    else s.placeIds.push(pid);
    s.updatedAt = Date.now(); dirty = true;
    b.closest('.step').querySelectorAll('[data-sp]').forEach(c=>{
      const cp = c.dataset.pid;
      c.classList.toggle('on', cp ? s.placeIds.includes(cp) : s.placeIds.length === 0);
    });
  });
  el.querySelectorAll('[data-addimg]').forEach(b=> b.onclick = ()=> pickPhotos({addTo: b.dataset.addimg}));
  el.querySelectorAll('[data-rmimg]').forEach(b=> b.onclick = ()=>{
    const [sid, iid] = b.dataset.rmimg.split('|');
    const st = m.steps.find(x=> x.id === sid);
    if(!st) return;
    st.imageIds = (st.imageIds||[]).filter(x=> x !== iid);
    st.updatedAt = Date.now(); dirty = true; renderEdit();
  });

  /* --- 枝（追加事項）--- */
  el.querySelectorAll('[data-braddbr]').forEach(b=> b.onclick = ()=>{
    const st = m.steps.find(x=> x.id === b.dataset.braddbr);
    if(!st) return;
    st.branches = st.branches || [];
    st.branches.push({id:'br_'+uid(), title:'', body:'', imageIds:[]});
    st.updatedAt = Date.now(); dirty = true; renderEdit();
  });
  el.querySelectorAll('[data-bf]').forEach(inp=>{
    inp.oninput = e=>{
      const st = m.steps.find(x=> x.id === inp.dataset.sid);
      const br = st && (st.branches||[]).find(x=> x.id === inp.dataset.bid);
      if(!br) return;
      br[inp.dataset.bf] = e.target.value; st.updatedAt = Date.now(); dirty = true;
    };
  });
  el.querySelectorAll('[data-brm]').forEach(b=> b.onclick = ()=>{
    const [sid, bid] = b.dataset.brm.split('|');
    const st = m.steps.find(x=> x.id === sid);
    if(!st) return;
    const k = st.branches.findIndex(x=> x.id === bid);
    if(k < 0) return;
    const removed = st.branches.splice(k, 1)[0];
    dirty = true; renderEdit();
    toastAction('枝を削除しました', '元に戻す', ()=>{ st.branches.splice(k, 0, removed); dirty = true; renderEdit(); });
  });
  el.querySelectorAll('[data-braddimg]').forEach(b=>{
    const [sid, bid] = b.dataset.braddimg.split('|');
    b.onclick = ()=> pickPhotos({addTo: sid, br: bid});
  });
  el.querySelectorAll('[data-brrmimg]').forEach(b=> b.onclick = ()=>{
    const [sid, bid, iid] = b.dataset.brrmimg.split('|');
    const st = m.steps.find(x=> x.id === sid);
    const br = st && (st.branches||[]).find(x=> x.id === bid);
    if(!br) return;
    br.imageIds = (br.imageIds||[]).filter(x=> x !== iid);
    st.updatedAt = Date.now(); dirty = true; renderEdit();
  });
}

/* 削除＝ゴミ箱へ移動。あとから戻せます */
function moveStepToTrash(id){
  const i = current.steps.findIndex(s=> s.id === id);
  if(i < 0) return;
  const removed = current.steps.splice(i, 1)[0];
  current.trash = current.trash || [];
  current.trash.unshift({at: Date.now(), index: i, step: removed});
  dirty = true; renderEdit();
  toastAction(`手順${i+1}をゴミ箱へ移動しました`, '元に戻す', ()=> restoreFromTrash(removed.id));
}
/* ゴミ箱から元の位置へ戻す */
function restoreFromTrash(stepId){
  const k = (current.trash||[]).findIndex(t=> t.step.id === stepId);
  if(k < 0) return;
  const t = current.trash.splice(k, 1)[0];
  const at = Math.min(typeof t.index === 'number' ? t.index : current.steps.length, current.steps.length);
  current.steps.splice(at, 0, normalizeStep(t.step));
  dirty = true; renderEdit();
  toast(`手順を${at + 1}番目に戻しました`);
}
/* 完全に削除（写真も消えます） */
function purgeFromTrash(stepId){
  const k = (current.trash||[]).findIndex(t=> t.step.id === stepId);
  if(k < 0) return;
  const t = current.trash[k];
  confirmSheet('完全に削除しますか？',
    `「${t.step.title || '見出しなし'}」と、その写真が元に戻せなくなります。`, '完全に削除', async ()=>{
    for(const id of stepImageIds(t.step)){
      await idbDel('images', id);
      if(isCloud()) await Cloud.delPhoto(id);
    }
    current.trash.splice(k, 1);
    dirty = true; renderEdit();
    toast('完全に削除しました');
  });
}
function emptyTrash(){
  const n = (current.trash||[]).length;
  if(!n) return;
  confirmSheet('ゴミ箱を空にしますか？', `${n}件の手順と写真が元に戻せなくなります。`, '空にする', async ()=>{
    for(const t of current.trash){
      for(const id of stepImageIds(t.step)){
        await idbDel('images', id);
        if(isCloud()) await Cloud.delPhoto(id);
      }
    }
    current.trash = [];
    dirty = true; renderEdit();
    toast('ゴミ箱を空にしました');
  });
}
function moveStep(id, dir){
  const i = current.steps.findIndex(s=> s.id === id);
  const j = i + dir;
  if(i<0 || j<0 || j>=current.steps.length) return;
  [current.steps[i], current.steps[j]] = [current.steps[j], current.steps[i]];
  dirty = true; renderEdit();
}

/* 保存（2回目以降は「更新メモ」を残して改訂履歴に記録） */
function saveManual(){
  const m = current;
  if(!m.title.trim()){ toast('タイトルを入力してください'); $('fTitle').focus(); return; }
  if(m._isNew){
    commitSave('新規作成');
  }else{
    noteSheet(note=> commitSave(note || '内容を更新'));
  }
}
async function commitSave(note){
  const m = current;
  m.title = m.title.trim();
  m.places = (m.places||[]).filter(p=> (p.name||'').trim());
  delete m.place;
  m.updatedAt = Date.now();
  m.history = m.history || [];
  m.history.unshift({at: Date.now(), note, steps: m.steps.length});
  delete m._isNew; delete m._from;
  const clean = JSON.parse(JSON.stringify(m, (k,v)=> k.startsWith('_') ? undefined : v));
  let queued = false;
  try{
    if(isCloud()) queued = (await cloudWrite(Cloud.saveManual(clean))) === 'queued';
    else await idbPut('manuals', clean);
  }catch(e){
    toast(cloudErrorText(e));
    return;
  }
  dirty = false;
  if(isCloud()){
    current = migrate(JSON.parse(JSON.stringify(clean)));
    const i = manuals.findIndex(x=> x.id === clean.id);
    if(i >= 0) manuals[i] = migrate(JSON.parse(JSON.stringify(clean))); else manuals.unshift(current);
  }else{
    await loadAll();
    current = migrate(await idbGet('manuals', m.id));
  }
  toast(!isCloud() ? `保存しました（v${m.history.length}）`
        : queued ? `保存しました（v${m.history.length}・電波が戻ったら共有します）`
                 : `保存しました（v${m.history.length}・みんなに反映）`);
  setView('read');
}
function deleteManual(m){
  confirmSheet('マニュアルを削除しますか？', `「${m.title || '無題'}」と写真をすべて削除します。元に戻せません。`, '完全に削除', async ()=>{
    for(const id of allImageIds(m)){
      await idbDel('images', id);
      if(isCloud()) await Cloud.delPhoto(id);
    }
    if(isCloud()){
      await Cloud.deleteManual(m.id);
      manuals = manuals.filter(x=> x.id !== m.id);
    }else{
      await idbDel('manuals', m.id);
      await loadAll();
    }
    current = null; dirty = false;
    toast('削除しました'); setView('list');
  });
}

/* 開閉できるブロック（初期状態は閉じる） */
function foldBlock(title, badge, inner){

function historyHTML(m){

const fmtTime = ts => { const d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

}

/* 対応済のチェック（改訂履歴とは別。端末にすぐ保存されます） */
async function markPlace(pid){
  const m = current, places = placesOf(m), prog = m.progress || (m.progress = {});
  const p = places.find(x=> x.id === pid);
  if(!p) return;
  const wasAll = places.length > 0 && doneCount(m) === places.length;

  if(prog[pid]){
    delete prog[pid];
    toast(`${p.name} の「対応済」を取り消しました`);
  }else{
    prog[pid] = Date.now();
    const rest = places.filter(x=> !prog[x.id]).length;
    if(!wasAll && !rest){
      m.progressAt = Date.now();
      m.rounds = m.rounds || [];
      m.rounds.unshift({at: Date.now(), n: places.length});
      /* 「おつかれさまでした！」は場所えらび画面に大きく出すので、トーストは出さない */
    }else{
      toast(`${p.name} 完了　残り${rest}か所`);
    }
    readSel = null;   // 場所えらびに戻る
  }
  await saveProgress(m);
  renderRead();
}
function resetProgress(){
  confirmSheet('対応状況をリセットしますか？', '全場所のチェックが外れ、次の対応に使えます。対応ログは残ります。', 'リセットする', async ()=>{
    current.progress = {};
    delete current.progressAt;
    readSel = null;
    await saveProgress(current);
    renderRead();
    toast('対応状況をリセットしました');
  });
}
/* 進捗だけの保存（改訂履歴・更新日時は動かさない）
   共有モードでは progress の項目だけを更新するので、
   別の場所を同時にチェックしても互いを打ち消しません。 */
async function saveProgress(m){
  const clean = JSON.parse(JSON.stringify(m, (k,v)=> k.startsWith('_') ? undefined : v));
  const i = manuals.findIndex(x=> x.id === m.id);
  if(i >= 0) manuals[i] = clean;
  if(isCloud()){
    try{
      await cloudWrite(Cloud.patchManual(m.id, {
        progress: clean.progress || {},
        progressAt: clean.progressAt || null,
        rounds: clean.rounds || []
      }));
    }catch(e){ toast(cloudErrorText(e)); }
  }else{
    await idbPut('manuals', clean);
  }
}
async function shareManual(m){
  const pl = placesOf(m);
  const lines = [`【${m.title}】`];
  if(pl.length) lines.push(`対象：${pl.map(p=> p.name).join('・')}（対応済 ${doneCount(m)}/${pl.length}）`);
  lines.push(`最終更新 ${fmtDateTime(m.updatedAt)}`, '');
  m.steps.forEach((s,i)=>{
    const tg = (s.placeIds||[]).map(id=> (pl.find(p=> p.id===id)||{}).name).filter(Boolean);
    lines.push(`${i+1}. ${s.title || '手順'+(i+1)}${tg.length ? '（'+tg.join('・')+'）' : ''}`);
    if(s.body) lines.push(`   ${s.body.replace(/\n/g,'\n   ')}`);
    if(s.caution) lines.push(`   ⚠️ ${s.caution.replace(/\n/g,'\n   ')}`);
    lines.push('');
  });
  const text = lines.join('\n');
  if(navigator.share){ try{ await navigator.share({title:m.title, text}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('本文をコピーしました'); }
  catch(e){ toast('共有に対応していません'); }
}

/* この端末だけに入っているマニュアルを、共有側へ引っ越す */
async function uploadLocalToCloud(){
  const local = ((await idbAll('manuals')) || []).map(migrate);
  if(!local.length){ toast('この端末だけのマニュアルはありません'); return; }
  const already = new Set(manuals.map(m=> m.id));
  const target = local.filter(m=> !already.has(m.id));
  if(!target.length){ toast('すべて共有済みです'); return; }
  confirmSheet(`${target.length}件を共有に移しますか？`,
    'この端末で作ったマニュアルを、写真ごと全員が見られる状態にします。', '共有する', async ()=>{
    let n = 0;
    for(const m of target){
      for(const id of allImageIds(m)){
        const d = await photoDataURL(id);
        if(d) await Cloud.putPhoto(id, d);
      }
      await Cloud.saveManual(JSON.parse(JSON.stringify(m)));
      n++;
      toast(`共有中… ${n}/${target.length}`);
    }
    toast(`${n}件を共有しました`);
  });
}

/* =========================================================
   バックアップ（写真ごとJSONに入れる）
   ========================================================= */
const blobToDataURL = b => new Promise(r=>{ const f = new FileReader(); f.onload = ()=> r(f.result); f.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();

async function exportAll(){
  toast('書き出し中…');
  const images = {};
  for(const m of manuals){
    for(const id of allImageIds(m)){
      if(images[id]) continue;
      const d = await photoDataURL(id);
      if(d) images[id] = d;
    }
  }
  const data = {app:'genba-manual', version:1, exportedAt:Date.now(), manuals, images};
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = `NagomiResortマニュアル_${fmtDate(Date.now()).replace(/\//g,'')}.json`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  toast('バックアップを保存しました');
}
$('fileImport').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(data.app !== 'genba-manual') throw new Error('形式が違います');
    for(const [id, durl] of Object.entries(data.images || {})){
      await idbPut('images', {id, blob: await dataURLToBlob(durl)});
      if(isCloud()) await Cloud.putPhoto(id, durl);
    }
    for(const m of data.manuals || []){
      const mm = migrate(m);
      if(isCloud()) await Cloud.saveManual(JSON.parse(JSON.stringify(mm)));
      else await idbPut('manuals', mm);
    }
    if(!isCloud()){ await loadAll(); }
    setView('list');
    toast(`${(data.manuals||[]).length}件を読み込みました`);
  }catch(err){ toast('読み込めませんでした'); }
  e.target.value = '';
};

/* ---------- 離脱ガード ---------- */
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- 合い言葉のゲート ---------- */
let cloudWatch = null;
function showGate(msg){
  $('gate').classList.remove('hidden');
  $('gateMsg').textContent = msg || '';
  $('gateMsg').classList.remove('wait');
  setTimeout(()=> $('gatePass').focus(), 200);
}
function hideGate(){ $('gate').classList.add('hidden'); }
async function tryGate(){
  const v = $('gatePass').value.trim();
  if(!v){ $('gatePass').focus(); return; }
  $('gateBtn').disabled = true;
  $('gateMsg').textContent = '確認しています…';
  $('gateMsg').classList.add('wait');
  try{
    await Cloud.signIn(v);
    $('gatePass').value = '';
    $('gateMsg').textContent = '';
  }catch(e){
    $('gateMsg').textContent = e.message || 'ログインできませんでした';
    $('gateMsg').classList.remove('wait');
  }
  $('gateBtn').disabled = false;
}
$('gateBtn').onclick = tryGate;
$('gatePass').onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); tryGate(); } };

/* cloud.js（Firebase）の準備を待つ。設定が空、または読めないときは端末内保存で動かす */
function whenCloud(){
  if(window.Cloud) return Promise.resolve();
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey) return Promise.resolve();
  return new Promise(res=>{
    const done = ()=> res();
    window.addEventListener('cloud-ready', done, {once:true});
    setTimeout(done, 8000);   // 通信できないときも起動できるように
  });
}

/* ---------- 起動 ---------- */
(async ()=>{
  await whenCloud();

  if(window.Cloud && Cloud.enabled){
    $('barSub').textContent = '共有マニュアル';
    Cloud.onAuth(u=>{
      if(u){
        hideGate();
        if(!cloudWatch){
          cloudWatch = Cloud.watchManuals(onCloudManuals, ()=> toast('共有先に接続できません'));
        }
        if(view === 'list') renderList();
      }else{
        if(cloudWatch){ cloudWatch(); cloudWatch = null; }
        manuals = [];
        showGate();
      }
    });
    setView('list');
  }else{
    await loadAll();
    setView('list');
  }

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
